version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Chờ 7 ngày sau khi một phiên bản mới ra mới đề xuất: tránh dính gói bị chiếm quyền vừa phát hành.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        dependency-type: "development"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
