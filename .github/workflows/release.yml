# Phát hành: chỉ chạy khi đẩy tag vX.Y.Z. Build trên GitHub Actions (không build máy cá nhân) để ai cũng
# kiểm chứng được: SHA256SUMS + SBOM (CycloneDX) + GitHub artifact attestation (SLSA provenance).
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    # Chặn phát hành khi quy trình review chưa có người thật (L1-024)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CODEOWNERS phải là tài khoản/nhóm thật
        run: |
          if grep -q "@vietpdf-maintainers" .github/CODEOWNERS; then
            echo "::error::CODEOWNERS còn nhóm giữ chỗ @vietpdf-maintainers — thay bằng người duyệt thật trước khi phát hành"
            exit 1
          fi

  build:
    needs: preflight
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            artifact: VietPDF-windows-x64
          - os: macos-latest
            artifact: VietPDF-macos-arm64
          - os: ubuntu-22.04
            artifact: VietPDF-linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Cài đặt đúng theo uv.lock (có hash); build backend hatchling có hash (L1-024)
        run: |
          uv sync --locked --all-groups --all-extras --no-install-project
          uv pip install --require-hashes -r build-constraints.txt
          uv pip install --no-deps --no-build-isolation .
      - name: Toàn bộ kiểm tra trước khi đóng gói
        run: |
          uv run python scripts/security_audit.py src scripts
          uv run pytest -q
      - name: PyInstaller
        run: uv run pyinstaller packaging/vietpdf.spec --noconfirm --clean
      - name: Kiểm tra bản đóng gói chạy được
        shell: bash
        run: |
          BIN=dist/VietPDF/vietpdf; [ -f dist/VietPDF/vietpdf.exe ] && BIN=dist/VietPDF/vietpdf.exe
          "$BIN" verify-assets
      - name: SBOM (CycloneDX) của môi trường build
        run: uv run cyclonedx-py environment --output-format JSON --output-file dist/sbom-${{ matrix.artifact }}.cdx.json
      - name: Nén
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a -tzip "${{ matrix.artifact }}.zip" VietPDF >/dev/null
          else tar -czf "${{ matrix.artifact }}.tar.gz" VietPDF; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.*
            dist/sbom-*.json
          retention-days: 7

  publish:
    needs: build
    # Environment "release" phải được cấu hình "Required reviewers" (≥ 1 người khác người đẩy tag) trong Settings
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # tạo GitHub Release
      id-token: write        # ký attestation bằng Sigstore (OIDC)
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: SHA256SUMS
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "out/*"
      - name: Tạo GitHub Release (bản nháp, người duy trì duyệt rồi mới công bố)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG"
          --notes "Xem CHANGELOG.md. Kiểm tra: gh attestation verify <file> --repo $GITHUB_REPOSITORY"
