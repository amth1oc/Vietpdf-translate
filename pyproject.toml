[project]
name = "vietpdf-translate"
version = "2.1.3"
description = "Dịch PDF Anh → Việt giữ nguyên bố cục (English → Vietnamese PDF translation preserving layout)"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11,<3.14"
authors = [{ name = "VietPDF Translate contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
]
# Giữ danh sách phụ thuộc chạy NHỎ NHẤT có thể (giảm bề mặt tấn công chuỗi cung ứng).
# Mỗi phụ thuộc mới phải được review (xem CONTRIBUTING.md).
dependencies = [
    # 1.28.x không có phụ thuộc con; 2.x kéo thêm onnxruntime/networkx/pyyaml... -> review riêng.
    "pymupdf>=1.28.2,<2",
    "httpx>=0.28,<0.29",
    "pydantic>=2.10,<3",
    "keyring>=25,<26",
    # giám sát bộ nhớ tiến trình con trên mọi hệ điều hành
    "psutil>=6,<8",
    # mã hoá cache AES-GCM (PyCA, đã là phụ thuộc gián tiếp của keyring trên Linux)
    "cryptography>=44,<51",
]

[project.optional-dependencies]
gui = ["pyside6-essentials>=6.8,<7"]
# OCR trang scan: mô hình PP-OCR ONNX nằm sẵn trong gói rapidocr (khoá hash trong uv.lock)
# onnxruntime < 1.29: từ 1.29 bản PyPI nhúng telemetry OneDS (gửi tới mobile.events.data.microsoft.com), không tắt
# được bằng API (kiểm toán 2.1.1, L1-007). Chỉ nâng cận trên sau khi kiểm lại bản mới không còn telemetry mạng.
ocr = ["rapidocr>=3.10,<4", "onnxruntime>=1.20,<1.32"]
# Nhận diện bố cục bằng DocLayout-YOLO ONNX (mô hình tải riêng bằng scripts/fetch_models.py, ghim SHA-256)
layout = ["onnxruntime>=1.20,<1.32", "numpy>=1.26,<3"]

[project.scripts]
vietpdf = "vietpdf.cli:main"

[project.gui-scripts]
vietpdf-gui = "vietpdf.gui.app:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.8,<0.18",
    "mypy>=1.13,<3",
    "pip-audit>=2.7,<3",
    "onnx>=1.17,<2",  # chỉ để test: dựng mô hình ONNX giả kiểm tra đường nạp mô hình bố cục
    "pyyaml>=6,<7",  # scripts/check_workflows.py: kiểm cú pháp workflow GitHub Actions trong CI
]
# Chỉ dùng trong release.yml (đóng gói + SBOM); khoá trong uv.lock như mọi phụ thuộc khác.
build = [
    "pyinstaller>=6.11,<7",
    "cyclonedx-bom>=5,<8",
]

[build-system]
requires = ["hatchling==1.32.0"]  # ghim đúng phiên bản: build backend không nằm trong uv.lock
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vietpdf"]

[tool.uv]
# Không cho phép cài gói từ nguồn khác ngoài PyPI chính thức.
index-url = "https://pypi.org/simple"
# Không chọn phiên bản được tải lên PyPI trong 7 ngày gần nhất (áp cho MỌI lần `uv lock`, kể cả cập nhật thủ công —
# không chỉ Dependabot): giảm rủi ro dính gói vừa bị chiếm quyền (L1-024).
exclude-newer = "7 days"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# S = flake8-bandit (lỗi bảo mật), B = bugbear, UP = pyupgrade, SIM, I = isort
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL"]
ignore = [
    "PLR0913", "PLR0912", "PLR0915", "PLR2004", "PLR0911", "PLR0917",
    "RUF001", "RUF002", "RUF003",  # cho phép ký tự tiếng Việt / ⟦ ⟧ trong chuỗi & comment
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLC0415"]
"scripts/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["vietpdf"]
exclude = ["src/vietpdf/gui/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# PyMuPDF chỉ có type hint một phần -> coi là Any; keyring nạp động
module = ["pymupdf", "pymupdf.*", "keyring", "keyring.*", "psutil", "onnxruntime", "rapidocr", "numpy", "onnx"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
